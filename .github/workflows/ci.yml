name: CI

# Work happens directly on main, so this is the safety net that runs after the fact.
# The pull_request trigger stays for the occasional branch worth vetting before it lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # pnpm's version comes from the `packageManager` field in package.json, so CI can
      # never drift from local dev. Corepack ships with Node 24; from Node 25 it is
      # unbundled and this step needs `npm i -g corepack` in front of it.
      - name: Enable corepack
        run: corepack enable

      # setup-node's built-in `cache: pnpm` can't be used here — it probes for pnpm before
      # corepack has installed the shims, so it fails to find a package manager. Caching
      # the store directly is equivalent.
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # `prepare` runs tsup, so dist/ and the .d.ts/.d.mts trees are built here.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The suites need logical decoding (wal_level=logical) plus dedicated replication
      # slots, so they run against the real compose services rather than a plain
      # postgres service container.
      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Test
        run: pnpm test

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop Postgres
        if: always()
        run: docker compose down -v
