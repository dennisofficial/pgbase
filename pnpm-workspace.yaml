packages:
  - '.'
  - examples/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: false
  sharp: false

# Atlas consumes this repo as a submodule and globs `submodules/**`, which would otherwise pull
# examples/* into ITS workspace and impose its overrides (react 19.2.7, typescript 6.0.3,
# injectWorkspacePackages, nodeLinker: isolated) on them. Atlas excludes them explicitly; this
# file is what makes the examples resolve when pgbase is cloned standalone.
